# Builds everything on GitHub's servers so nothing has to be installed
# locally:
#  - android: release APKs (one per CPU type, ~20 MB each) as artifacts
#  - web: the browser version, published to GitHub Pages
name: APK ve web derle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The generated Android project is not committed. `flutter create`
      # only adds missing files; AndroidManifest.xml and the Kotlin sources
      # in the repo are kept.
      - name: Generate Android project files
        run: flutter create --org com.gsu --project-name gsu_fit --platforms android .

      - name: Patch Gradle (minSdk 26, release signing)
        run: dart run tool/patch_android.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: flutter test

      # Without android/key.properties the release build is signed with the
      # debug key: fine for installing on your own phone, not for a store.
      - name: Build release APKs (one per CPU type)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: gsu-fit-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: gsu-fit-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          echo "### Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- flutter analyze: ${{ steps.analyze.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- flutter test: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          ls -la build/app/outputs/flutter-apk/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project files
        run: flutter create --org com.gsu --project-name gsu_fit --platforms web .

      - name: Patch web files (name, language)
        run: dart run tool/patch_android.dart

      # Served from https://<user>.github.io/<repo>/, hence the base href.
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # GitHub Pages on the free plan needs a public repository.
  deploy-web:
    needs: web
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
